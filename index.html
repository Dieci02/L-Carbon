  ['sp and sp² bonding', 'Chains, branches, rings', 'The first molecules'],
  ['One atom thick', 'sp² bonded', '2D hexagonal lattice'],
  ['Stacked graphene', '0.335 nm apart', 'Van der Waals only'],
  ['Rolled graphene', 'Armchair (n,n)', 'Seamless cylinder'],
  ['Sixty atoms', '12 pentagons, 20 hexagons', 'Closed cage'],
  ['sp³ bonded', '109.47° tetrahedra', 'Diamond cubic'],
  ['Refractive index 2.42', '57 facets', 'Hardest natural material'],
  ['No long-range order', 'Mixed sp² and sp³', 'Soot, glassy carbon, ta-C']
].forEach((sp, i) => { CH[i].spec = sp; });

/* The carbon population itself. Any state can be asked for the atoms it is
   currently made of: they are all instanced spheres on a shared geometry, so
   one function reads every state without any of them knowing about it. */
const MN = 260;
function harvest(group, ch) {
  group.updateMatrixWorld(true);
  const inv = new THREE.Matrix4().copy(group.matrixWorld).invert();
  const balls = Object.keys(_geo).filter(k => k[0] === 'b').map(k => _geo[k]);
  const out = [];
  let rad = 0.12;
  const m = new THREE.Matrix4(), p = new THREE.Vector3(), q = new THREE.Quaternion(), sc = new THREE.Vector3();
  group.traverse(o => {
    if (!o.isInstancedMesh || balls.indexOf(o.geometry) < 0) return;
    for (let i = 0; i < o.count; i++) {
      o.getMatrixAt(i, m);
      m.premultiply(o.matrixWorld).premultiply(inv);
      m.decompose(p, q, sc);
      if (sc.x < 0.012) continue;               // an atom that has not grown yet
      out.push(p.clone());
      if (sc.x > rad) rad = sc.x;
    }
  });
  if (out.length) {
    const pick = [];
    for (let i = 0; i < MN; i++) pick.push(out[Math.floor(i * out.length / MN) % out.length].clone());
    return { p: pick, r: rad };
  }
  // a state with no discrete atoms (the single atom, the cloud, the stone):
  // sample the volume it occupies, so it disperses out of its own body
  const box = new THREE.Box3().setFromObject(group);
  const c = box.getCenter(new THREE.Vector3()), e = box.getSize(new THREE.Vector3()).multiplyScalar(0.42);
  const r = rng(9137), pick = [];
  for (let i = 0; i < MN; i++) {
    let x, y, z, d;
    do { x = r() * 2 - 1; y = r() * 2 - 1; z = r() * 2 - 1; d = x * x + y * y + z * z; } while (d > 1);
    d = Math.pow(d, 0.28);                       // bias inward: denser at the core
    pick.push(new THREE.Vector3(c.x + x * e.x * d, c.y + y * e.y * d, c.z + z * e.z * d));
  }
  return { p: pick, r: 0.16 };
}

/* ===========================================================================
   THE ROOM
   One renderer, one loop, one camera. Chapters are mounted into the same
   pivot and the framing is cut to them in the dark.
   ========================================================================= */

const el = id => document.getElementById(id);
const plaque = el('plaque'), ctrl = el('ctrl'), range = el('ctrlRange'), orbit = el('orbit');
const rail = el('rail');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const rig = {
  spin: 0, spinV: 0.05, auto: 0.05,
  yaw: 0, yawT: 0, pitch: 0.16, pitchT: 0.16,
  dist: 8, distT: 8, base: 8, zoom: 1, touched: false
};
let aspectK = 1, dustK = 1, dustT = 1, fogT = 0, shadowT = 0, shadowK = 0, fadeK = 0;
const state = { i: -1, obj: null, age: 0 };
let old = null, trans = null, camK = 1;
const seen = new Set();

function setControl(v, silent) {
  const c = CH[state.i].control;
  if (!c) return;
  el('ctrlVal').textContent = c.fmt(v);
  if (!silent && state.obj && state.obj.control) state.obj.control(v);
}

/* build a state and take its framing, without disturbing the one on screen */
function mount(i) {
  const ch = CH[i];
  fogT = ch.fog || 0;
  shadowT = ch.shadow ? 1 : 0;
  dustT = ch.dust === undefined ? 0.4 : ch.dust;

  const obj = ch.build();
  pivot.add(obj.group);
  fadeGroup(obj.group, 0);
  state.i = i; state.obj = obj; state.age = 0;
  seen.add(i);

  rig.base = ch.dist; rig.auto = REDUCED ? 0 : ch.spin;
  rig.zoom = 1; rig.touched = false; rig.yawT = rig.yaw;
  rig.pitchT = ch.pitch;                       // eased, not cut: the camera follows the matter

  el('chNo').textContent = ch.bond;
  el('chTitle').textContent = ch.title;
  el('chText').textContent = ch.text;
  el('chSpec').textContent = (ch.spec || []).join('  ·  ');

  if (ch.control) {
    ctrl.hidden = false;
    el('ctrlName').textContent = ch.control.name;
    range.value = ch.control.value;
    setControl(ch.control.value);
    ctrl.classList.add('hint');
  } else ctrl.hidden = true;

  paintChoices(ch);
  if (!trans) paintOrbit(ch);
  paintRail();
}

function paintOrbit(ch) {
  orbit.className = '';
  orbit.innerHTML = '';
  for (const [label, to, dir] of ch.to) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'node ' + (dir || 'right');
    b.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" ' +
      'stroke-linecap="round" stroke-linejoin="round">' + (GLYPH[CH[to].id] || '') + '</svg>' +
      '<span class="lab"></span>';
    b.querySelector('.lab').textContent = label;
    b.addEventListener('click', () => goTo(to, b));
    orbit.appendChild(b);
  }
}

function paintChoices(ch) {
  const box = el('choices');
  box.innerHTML = '';
  for (const [label, to] of ch.to) {
    const b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = '<span class="k"></span><span></span>';
    b.lastChild.textContent = label;
    b.addEventListener('click', () => goTo(to));
    box.appendChild(b);
  }
}

/* the map: everything is on it, but only what has been reached is named */
function open_() {
  const o = new Set(seen);
  for (const i of seen) for (const [, to] of CH[i].to) o.add(to);
  return o;
}
function paintRail() {
  const reach = open_();
  [...rail.children].forEach((b, k) => {
    b.classList.toggle('on', k === state.i);
    b.classList.toggle('locked', !reach.has(k));
    b.setAttribute('aria-current', k === state.i ? 'true' : 'false');
  });
}

/* ---------------------------------------------------------------------------
   TRANSFORMATION
   The old structure lets go of its atoms, the atoms travel, the new structure
   takes them. Nothing is cut to black; the population is continuous.
   ------------------------------------------------------------------------- */
const A_DUR = 0.34, M_DUR = 1.5, HAND = 0.70;
let cloud = null, cCur = null, cLaunch = null, cDst = null, cR = [0.1, 0.1], cAx = null;

/* The population is lifted first and the destination is built a moment later,
   under cover of motion that has already started. Clicking is never followed
   by a pause. */
function goTo(i, node) {
  if (trans || i === state.i || i < 0 || i >= CH.length || !open_().has(i)) return;
  if (node) { node.classList.add('chosen'); orbit.classList.add('picking'); }

  const src = harvest(state.obj.group, CH[state.i]);
  cCur = src.p;
  cLaunch = null; cDst = null;
  cR = [src.r, src.r];
  const r = rng(4242);
  cAx = [];
  for (let k = 0; k < MN; k++) {
    const v = new THREE.Vector3(r() * 2 - 1, r() * 2 - 1, r() * 2 - 1);
    if (v.lengthSq() < 1e-6) v.set(0, 1, 0);
    cAx.push(v.normalize());
  }
  cloud = new THREE.InstancedMesh(ball(2), carbon({ roughness: 0.42, envMapIntensity: 1.55 }), MN);
  cloud.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  cloud.frustumCulled = false;
  cloud.material.opacity = 0;
  for (let k = 0; k < MN; k++) atomAt(cloud, k, cCur[k], src.r);
  cloud.instanceMatrix.needsUpdate = true;
  pivot.add(cloud);

  old = state.obj;
  plaque.classList.add('hid');
  trans = { t: 0, to: i, from: state.i, built: false, tb: 0, named: false, hid: false };
}

const _p = new THREE.Vector3(), _arc = new THREE.Vector3();

function stepTransition(dt) {
  const T = (trans.t += dt);

  if (old) {
    fadeGroup(old.group, 1 - smoother(T / 0.40));
    if (T >= 0.40) { disposeGroup(old.group); old = null; }
  }
  if (!trans.hid && T >= 0.24) { trans.hid = true; orbit.classList.add('busy'); }

  if (!trans.built) {
    // the atoms loosen and breathe outward while the destination is prepared
    const k = smoother(T / A_DUR);
    for (let i = 0; i < MN; i++) {
      _p.copy(cCur[i]).multiplyScalar(1 + 0.055 * k).addScaledVector(cAx[i], 0.045 * k);
      atomAt(cloud, i, _p, cR[0] * (1 + 0.10 * k));
    }
    cloud.instanceMatrix.needsUpdate = true;

    if (T >= A_DUR * 0.42) {
      // pick the rig up from wherever the camera actually is, so nothing cuts
      const cd = camera.position.length();
      if (cd > 0.4) {
        rig.dist = Math.max(1.5, cd);
        rig.pitch = Math.asin(clamp(camera.position.y / cd, -1, 1));
        rig['dist$v'] = 0; rig['pitch$v'] = 0;
      }
      const cameFrom = trans.from;
      mount(trans.to);
      flashEdge(cameFrom, trans.to);
      if (state.obj.update) state.obj.update(1 / 60, performance.now() / 1000, 0);
      const dst = harvest(state.obj.group, CH[trans.to]);
      cDst = dst.p; cR[1] = dst.r;
      cLaunch = [];
      const m = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3();
      for (let i = 0; i < MN; i++) {
        cloud.getMatrixAt(i, m);
        const v = new THREE.Vector3();
        m.decompose(v, q, sc);
        cLaunch.push(v);
      }
      trans.built = true;
      trans.tb = trans.t;
    }
  } else {
    const k = smoother((T - trans.tb) / M_DUR);
    for (let i = 0; i < MN; i++) {
      const a = cLaunch[i], b = cDst[i];
      const ki = smoother((k - (i / MN) * 0.20) / 0.80);
      _p.lerpVectors(a, b, ki);
      _arc.copy(cAx[i]).multiplyScalar(Math.sin(Math.PI * ki) * a.distanceTo(b) * 0.10);
      _p.add(_arc);
      atomAt(cloud, i, _p, lerp(cR[0], cR[1], ki) * (1 + 0.20 * Math.sin(Math.PI * ki)));
    }
    cloud.instanceMatrix.needsUpdate = true;

    // the real structure takes over from underneath, as the cloud thins
    const hand = trans.tb + M_DUR * HAND;
    fadeGroup(state.obj.group, smoother((T - hand) / (M_DUR * 0.40)));
    cloud.material.opacity = 1 - smoother((T - hand) / (M_DUR * 0.34));

    if (!trans.named && T >= trans.tb + M_DUR * 0.42) {
      trans.named = true;
      plaque.classList.remove('hid');
    }
    if (T >= trans.tb + M_DUR + 0.18) {
      disposeGroup(cloud); cloud = null;
      fadeGroup(state.obj.group, 1);
      trans = null;
      paintOrbit(CH[state.i]);
    }
  }
  if (trans && cloud && !trans.built) cloud.material.opacity = smoother(T / 0.18);
}

/* ---------------------------------------------------------------------------
   THE MAP
   A diagram of where carbon can go, drawn once. It reports; it does not drive.
   Only states already reached can be clicked, and only to go back to them —
   everything new is reached by acting on the structure itself.
   ------------------------------------------------------------------------- */
const TREE = [
  [0, 0, 0, -1], [1, 1, 1, 0], [2, 2, 1, 0], [10, 3, 2, 2], [3, 4, 2, 2],
  [4, 5, 3, 3], [5, 6, 4, 4], [6, 7, 4, 4], [7, 8, 4, 4], [8, 9, 3, 3], [9, 10, 4, 8]
];
const POS = {}, edgeEl = {}, nodeEl = [];
TREE.forEach(([i, row, d, par]) => { POS[i] = { x: 8 + d * 13, y: 12 + row * 25, par: par }; });
{
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 170 275');
  for (const [i] of TREE) {
    const P = POS[i];
    if (P.par < 0) continue;
    const Q = POS[P.par];
    const e = document.createElementNS(NS, 'path');
    e.setAttribute('d', 'M ' + Q.x + ' ' + (Q.y + 7) + ' V ' + (P.y - 6) +
      ' Q ' + Q.x + ' ' + P.y + ' ' + (Q.x + 6) + ' ' + P.y + ' H ' + (P.x - 6));
    svg.appendChild(e);
    edgeEl[i] = e;
  }
  rail.appendChild(svg);
  for (const [i] of TREE) {
    const P = POS[i];
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'node';
    b.style.left = (P.x - 3.5) + 'px';
    b.style.top = P.y + 'px';
    b.innerHTML = '<i class="dot"></i><span class="n"></span>';
    b.lastChild.textContent = CH[i].id;
    b.setAttribute('aria-label', CH[i].title);
    b.addEventListener('click', () => { if (seen.has(i)) goTo(i); });
    rail.appendChild(b);
    nodeEl[i] = b;
  }
}

function paintRail() {
  const near = new Set();
  for (const [, to] of CH[state.i].to) near.add(to);
  for (const [i] of TREE) {
    const b = nodeEl[i];
    b.className = 'node' +
      (seen.has(i) ? ' seen' : near.has(i) ? ' near' : '') +
      (seen.has(i) && i !== state.i ? ' link' : '') +
      (i === state.i ? ' on' : '');
    b.setAttribute('aria-current', i === state.i ? 'true' : 'false');
  }
  for (const k in edgeEl) edgeEl[k].classList.remove('on');
  let c = state.i, guard = 0;
  while (POS[c] && POS[c].par >= 0 && guard++ < 24) { edgeEl[c].classList.add('on'); c = POS[c].par; }
}

/* the branch just travelled lights up, so the move is legible on the map */
function flashEdge(from, to) {
  const e = (POS[to] && POS[to].par === from) ? edgeEl[to]
          : (POS[from] && POS[from].par === to) ? edgeEl[from] : null;
  if (!e) return;
  e.classList.remove('flash');
  void e.getBoundingClientRect();
  e.classList.add('flash');
  setTimeout(() => e.classList.remove('flash'), 1600);
}

range.addEventListener('input', () => { ctrl.classList.remove('hint'); setControl(parseFloat(range.value)); });

/* turning the specimen */
addEventListener('pointerdown', e => {
  if (e.button !== 0 || (e.target.closest && e.target.closest('#rail, .ctrl'))) return;
  rig.drag = true; rig.px = e.clientX; rig.py = e.clientY;
  document.body.classList.add('turning');
});
addEventListener('pointermove', e => {
  if (!rig.drag) return;
  rig.yawT -= (e.clientX - rig.px) * 0.0055;
  rig.pitchT = clamp(rig.pitchT + (e.clientY - rig.py) * 0.0038, -0.6, 1.15);
  rig.px = e.clientX; rig.py = e.clientY; rig.touched = true;
});
addEventListener('pointerup', () => { rig.drag = false; document.body.classList.remove('turning'); reveal(); });
let shown = false, born = 0;
function reveal() { if (!shown) { shown = true; document.body.classList.add('revealed'); } }
addEventListener('wheel', e => {
  if (e.target.closest && e.target.closest('#rail, .ctrl')) return;
  e.preventDefault();
  rig.zoom = clamp(rig.zoom * Math.exp(e.deltaY * 0.0008), 0.42, 1.9);
  rig.touched = true;
}, { passive: false });

let pinch0 = 0, zoom0 = 1;
addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    pinch0 = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY) || 1;
    zoom0 = rig.zoom;
  }
}, { passive: true });
addEventListener('touchmove', e => {
  if (e.touches.length !== 2) return;
  const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                       e.touches[0].clientY - e.touches[1].clientY);
  rig.zoom = clamp(zoom0 * pinch0 / d, 0.42, 1.9);
  rig.touched = true;
}, { passive: true });

addEventListener('keydown', e => {
  if (e.target === range && e.key.startsWith('Arrow')) return;
  reveal();
  const dir = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' }[e.key];
  if (dir) {
    e.preventDefault();
    const c = CH[state.i].to.find(x => x[2] === dir);
    if (c) goTo(c[1], orbit.querySelector('.' + dir));
  }
});

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  // a tall window needs the object further away to keep the same air around it
  aspectK = w / h < 1 ? 1 + (1 - w / h) * 0.6 : 1;
  dust.material.uniforms.uPix.value = renderer.getPixelRatio();
}
addEventListener('resize', resize);

/* ---------------------------------------------------------------------------
   THE LOOP
   ------------------------------------------------------------------------- */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000), t = now / 1000;
  last = now;
  if (!born) born = t;
  if (!shown && t - born > 6) reveal();

  if (!state.obj) return;
  state.age += dt;
  if (state.obj.update) state.obj.update(dt, t, state.age);

  // the transformation is stepped after each state has written its own materials
  if (trans) stepTransition(dt);
  fadeK = trans ? 0.55 : 1;

  dust.material.uniforms.uTime.value = t;
  dust.material.uniforms.uFade.value = dustK;
  shadow.material.opacity = 0.75 * shadowK;

  // the specimen's own turn, easing back to its pace after the viewer lets go
  rig.spinV = approach(rig.spinV, rig.drag ? 0 : rig.auto, 0.9, dt);
  rig.spin += rig.spinV * dt;
  rig.distT = rig.base * aspectK * rig.zoom;
  spring(rig, 'yaw', rig.yawT, rig.drag ? 11 : 4.6, dt);
  spring(rig, 'pitch', rig.pitchT, rig.drag ? 11 : 3.8, dt);
  spring(rig, 'dist', rig.distT, 2.9, dt);
  pivot.rotation.y = rig.spin + rig.yaw;

  dustK = approach(dustK, dustT, 1.8, dt);
  shadowK = approach(shadowK, shadowT, 2.2, dt);
  scene.fog.density = approach(scene.fog.density, fogT, 2.0, dt);
  shadow.visible = shadowK > 0.004;

  const over = state.obj.camera ? state.obj.camera(t) : null;
  const b = REDUCED ? 0 : 1;
  camK = approach(camK, trans ? 0 : 1, 1.7, dt);
  const fov = 28 + (((over && over.fov) || 28) - 28) * camK;
  if (Math.abs(camera.fov - fov) > 0.02) { camera.fov = fov; camera.updateProjectionMatrix(); }
  if (over && camK > 0.995) {
    camera.position.copy(over.pos);
    camera.position.x += Math.sin(t * 0.047) * 0.04 * b;
    camera.lookAt(over.look);
  } else if (over) {
    const d0 = rig.dist * (1 + Math.sin(t * 0.083) * 0.016 * b), p0 = rig.pitch;
    T.a.set(Math.sin(t * 0.047) * 0.10 * b, d0 * Math.sin(p0) + 0.06, d0 * Math.cos(p0));
    camera.position.lerpVectors(T.a, over.pos, camK);
    T.b.set(0, 0, 0).lerp(over.look, camK);
    camera.lookAt(T.b);
  } else {
    // microscopic camera life: a breath of dolly, a drift in height, a slight sway
    const d = rig.dist * (1 + Math.sin(t * 0.083) * 0.016 * b);
    const p = rig.pitch + Math.sin(t * 0.061) * 0.022 * b;
    camera.position.set(
      Math.sin(t * 0.047) * 0.10 * b,
      d * Math.sin(p) + 0.06 + Math.sin(t * 0.071) * 0.03 * b,
      d * Math.cos(p)
    );
    camera.lookAt(0, Math.sin(t * 0.053) * 0.02 * b, 0);
  }

  renderer.render(scene, camera);
}

resize();
// let the first paint land before the field is solved, so the room is black
// rather than blank while it happens
requestAnimationFrame(() => requestAnimationFrame(() => {
  mount(0);
  fadeGroup(state.obj.group, 1);
  paintRail();
  fadeK = 1;
  el('wait').classList.add('gone');
  document.body.classList.add('ready');
  requestAnimationFrame(frame);
}));

})();
</script>
</body>
</html>
